name: Paper accounting regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "diagnostic/**"]

permissions:
  contents: read

jobs:
  paper-accounting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run accounting regression tests
        env:
          DATABASE_URL: ""
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m py_compile paper_engine.py app.py auto_paper_bot.py telegram_notify.py
