name: SPEK RADAR PRO - BIST scan

on:
  workflow_dispatch:
    inputs:
      period:
        description: Historical lookback for daily OHLCV
        required: true
        default: "2y"
  schedule:
    - cron: "15 16 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SPEK RADAR PRO branch
        uses: actions/checkout@v4
        with:
          ref: spek-radar-pro
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spek-radar-pro/requirements.txt
      - name: Install dependencies
        working-directory: spek-radar-pro
        run: pip install -r requirements.txt
      - name: Run indicator and universe tests
        working-directory: spek-radar-pro
        run: PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Scan all KAP equity markets
        working-directory: spek-radar-pro
        run: PYTHONPATH=. python -m spek_radar.cli --all-bist --period "${{ github.event.inputs.period || '2y' }}"
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spek-radar-pro-scan-${{ github.run_number }}
          path: |
            spek-radar-pro/output/
          if-no-files-found: warn
          retention-days: 14
